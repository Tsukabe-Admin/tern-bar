[package]
name = "skua-helper"
# The bar compares this with the version a running helper reports, so bump it
# whenever the helper changes: a helper built before a `git pull` is noticed.
version = "0.1.3"
edition = "2021"
description = "Skua's background jobs: Bluetooth pairing questions, night light and clipboard history"
license = "MIT"
publish = false

[dependencies]
calloop = "0.14"
calloop-wayland-source = "0.4"
futures-channel = "0.3"
futures-lite = "2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Only what the Bluetooth job uses: a client (proxy), a service (interface)
# and zbus's own runtime (zbus::block_on).
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }

[dev-dependencies]
tempfile = "3"
# A stand-in compositor for tests/clipboard.rs: the server side of the same
# Wayland library the job uses.
wayland-backend = "0.3"

[profile.release]
strip = true
